name: pins

# Сторож зависимостей для дальнейших разработок.
# Раз в неделю (и по кнопке) проверяет две вещи, не устанавливая ничего:
#   1) под какие версии Python существуют колёса у текущих пинов;
#   2) вышли ли новые версии на PyPI.
# Если покрытие колёс перестало соответствовать заявленному диапазону — job падает,
# это сигнал: обновлять пины нельзя без проверки (или наоборот, пора обновлять).

on:
  schedule:
    - cron: "0 6 * * 1"      # каждый понедельник, 06:00 UTC
  workflow_dispatch:

jobs:
  support:
    name: поддержка версий и обновления
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # один коммит снимка deps.json в неделю
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Матрица поддержки (wheel по версиям Python)
        env:
          PYTHONUTF8: "1"
        run: python installer/install_tools/pins.py

      - name: Доступные обновления на PyPI
        env:
          PYTHONUTF8: "1"
        run: python installer/install_tools/pins.py --latest

      - name: Снимок обновлений (bench/results/deps.json)
        env:
          PYTHONUTF8: "1"
        run: |
          python installer/install_tools/pins.py --latest --write bench/results/deps.json \
            || echo "::warning::нет данных PyPI — снимок не обновлён, сервер покажет available: false"

      - name: Коммит снимка в master
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- bench/results/deps.json; then echo "снимок не изменился"; exit 0; fi
          git add bench/results/deps.json
          git commit -m "deps: снимок обновлений $(date -u +%Y-%m-%d)"
          git push
