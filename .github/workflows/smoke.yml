name: smoke

# Дёшево и по делу: проект должен собираться и проверяться на чистой машине
# БЕЗ моделей Stanza (fast-гейт не требует Stanza) — это гарантия, что клон рабочий,
# а данные воспроизводятся из markdown байт в байт на любой платформе.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Синтаксис всех файлов (только stdlib)
        run: python -m compileall -q правило bench scripts MCP-stanza-german

      - name: Гейт целостности (fast, без Stanza)
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: python правило/smoke_test.py

      - name: Наборы воспроизводятся из разметки (байт в байт)
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          python bench/build_sets.py
          git diff --exit-code -- bench/sets

      - name: Скрипты отвечают --help
        env:
          PYTHONUTF8: "1"
        run: |
          python scripts/doctor.py --help
          python scripts/unpack_models.py --help
          python scripts/pack_models.py --help
          python -c "import json;json.load(open('MCP-stanza-german/mcp.json.example',encoding='utf-8'))"

  full:
    # Самый важный гейт: требования из installer/requirements.txt должны быть ДОСТАТОЧНЫ,
    # чтобы валидатор и стенд работали с нуля (этот job ловит забытые зависимости —
    # так был найден pyphen, которого не было в requirements).
    name: полный прогон ${{ matrix.python-version }} (installer/requirements.txt + модели от Stanford)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.15"]   # единственная поддерживаемая версия (эталон)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Зависимости
        run: python -m pip install -q -r installer/requirements.txt

      - name: Модели Stanza — официальный источник Stanford ( stanza-resources + huggingface.co)
        env:
          PYTHONUTF8: "1"
        run: python -c "import stanza; stanza.download('de', verbose=False)"

      - name: Модели рабочие — правило на 52
        env:
          PYTHONUTF8: "1"
        run: python правило/validator.py --set bench/sets/corpus52.jsonl

      - name: Живой прогон (F1, валидатор, нарезчик)
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: python правило/smoke_test.py --full

      - name: doctor (FAIL 0 ожидается)
        env:
          PYTHONUTF8: "1"
        run: python scripts/doctor.py

      - name: MCP-сервер по stdio — handshake, инструменты, гейт, судья
        env:
          PYTHONUTF8: "1"
        run: python scripts/mcp_probe.py

  installer:
    name: install.ps1 / all.ps1 — текущий контракт (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Синтаксис скриптов установки (PowerShell 5.1)
        shell: powershell
        run: |
          foreach ($f in @("install.ps1", "bootstrap.ps1", "scripts\all.ps1")) {
            $err = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $f), [ref]$null, [ref]$err)
            if ($err.Count) { $f; $err | ForEach-Object { $_.ToString() }; exit 1 }
            "$f - разбирается без ошибок"
          }

      - name: Инвентаризация и тесты модулей
        shell: powershell
        run: |
          # -Check-режимы только читают; inventory.ps1 как отдельный CLI тоже работает.
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/inventory.ps1 -Json -NoNetwork
          if ($LASTEXITCODE -ge 4) { "::error::inventory.ps1 дал код $LASTEXITCODE"; exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/test-inventory.ps1 -CI
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/test-progress.ps1 -Fast -CI
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Регресс текущего контракта
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/test-contract.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: "all.ps1 -Check plan -Json"
        shell: powershell
        run: |
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File scripts/all.ps1 -Check plan -Json
          if ($LASTEXITCODE -ne 0) { "::error::-Check plan дал код $LASTEXITCODE"; exit 1 }
          $j = ($out -join "`n") | ConvertFrom-Json
          if (-not $j.steps -or @($j.steps).Count -eq 0) { "::error::в плане нет шагов"; exit 1 }
          $ids = @($j.steps) -join ', '
          "план: $ids"

      - name: "all.ps1 -Check mcp -Json"
        shell: powershell
        run: |
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File scripts/all.ps1 -Check mcp -Json
          $code = $LASTEXITCODE
          if ($code -ne 0 -and $code -ne 2) { "::error::-Check mcp дал код $code"; exit 1 }
          $j = ($out -join "`n") | ConvertFrom-Json
          if (-not $j.detail) { "::error::нет причины проверки mcp"; exit 1 }
          "mcp check: код $code, причина: $($j.detail)"
          exit 0   # код 2 = BLOCK, допустимое состояние; не возвращаем его как rc шага

      - name: "install.ps1 -Check ready -Json"
        shell: powershell
        run: |
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Check ready -Json
          $code = $LASTEXITCODE
          if ($code -ge 4) { "::error::-Check ready сломан: код $code"; exit 1 }
          "ready check: код $code (2 = среда ещё не собрана — нормально на чистом раннере)"
          exit 0   # 1/2/3 — ожидаемые состояния на чистом раннере
