name: smoke

# Дёшево и по делу: проект должен собираться и проверяться на чистой машине
# БЕЗ моделей Stanza (fast-гейт не требует Stanza) — это гарантия, что клон рабочий,
# а данные воспроизводятся из markdown байт в байт на любой платформе.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Синтаксис всех файлов (только stdlib)
        run: python -m compileall -q правило bench scripts MCP-stanza-german

      - name: Гейт целостности (fast, без Stanza)
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: python правило/smoke_test.py

      - name: Наборы воспроизводятся из разметки (байт в байт)
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          python bench/build_sets.py
          git diff --exit-code -- bench/sets

      - name: Скрипты отвечают --help
        env:
          PYTHONUTF8: "1"
        run: |
          python scripts/doctor.py --help
          python scripts/unpack_models.py --help
          python scripts/pack_models.py --help
          python scripts/install_mcp.py --help

  full:
    # Самый важный гейт: требования из requirements.txt должны быть ДОСТАТОЧНЫ,
    # чтобы валидатор и стенд работали с нуля (этот job ловит забытые зависимости —
    # так был найден pyphen, которого не было в requirements).
    name: полный прогон ${{ matrix.python-version }} (venv из requirements.txt + модели из релиза)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]   # 3.11 — эталон; 3.13 — «последний поддерживаемый»
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Зависимости строго по requirements.txt
        run: python -m pip install -q -r requirements.txt

      - name: Модели Stanza из релиза models-v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/models
          gh release download models-v1 -p "stanza-models-*.zip" -D /tmp/models
          python scripts/unpack_models.py --zip /tmp/models/*.zip --check

      - name: Живой прогон (F1, валидатор, нарезчик)
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: python правило/smoke_test.py --full

      - name: doctor (FAIL 0 ожидается)
        env:
          PYTHONUTF8: "1"
        run: python scripts/doctor.py

  powershell:
    name: setup.ps1 разбирается и планирует шаги (dry-run)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: setup.ps1 -DryRun
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup.ps1 -DryRun
