name: smoke

# Дёшево и по делу: проект должен собираться и проверяться на чистой машине
# БЕЗ моделей Stanza (fast-гейт не требует Stanza) — это гарантия, что клон рабочий,
# а данные воспроизводятся из markdown байт в байт на любой платформе.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Синтаксис всех файлов (только stdlib)
        run: python -m compileall -q правило bench scripts MCP-stanza-german

      - name: Гейт целостности (fast, без Stanza)
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: python правило/smoke_test.py

      - name: Наборы воспроизводятся из разметки (байт в байт)
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          python bench/build_sets.py
          git diff --exit-code -- bench/sets

      - name: Скрипты отвечают --help
        env:
          PYTHONUTF8: "1"
        run: |
          python scripts/doctor.py --help
          python scripts/unpack_models.py --help
          python scripts/pack_models.py --help
          python -c "import json;json.load(open('MCP-stanza-german/mcp.json.example',encoding='utf-8'))"

  full:
    # Самый важный гейт: требования из requirements.txt должны быть ДОСТАТОЧНЫ,
    # чтобы валидатор и стенд работали с нуля (этот job ловит забытые зависимости —
    # так был найден pyphen, которого не было в requirements).
    name: полный прогон ${{ matrix.python-version }} (requirements.txt + модели от Stanford)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.15"]   # единственная поддерживаемая версия (эталон)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Зависимости
        run: python -m pip install -q -r requirements.txt

      - name: Модели Stanza — официальный источник Stanford ( stanza-resources + huggingface.co)
        env:
          PYTHONUTF8: "1"
        run: python -c "import stanza; stanza.download('de', verbose=False)"

      - name: Модели рабочие — правило на 52
        env:
          PYTHONUTF8: "1"
        run: python правило/validator.py --set bench/sets/corpus52.jsonl

      - name: Живой прогон (F1, валидатор, нарезчик)
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: python правило/smoke_test.py --full

      - name: doctor (FAIL 0 ожидается)
        env:
          PYTHONUTF8: "1"
        run: python scripts/doctor.py

      - name: MCP-сервер по stdio — handshake, инструменты, гейт, судья
        env:
          PYTHONUTF8: "1"
        run: python scripts/mcp_probe.py

  powershell:
    name: setup.ps1 разбирается и планирует шаги (dry-run)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: setup.ps1 -DryRun
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup.ps1 -DryRun

  all_ps1:
    # Контракт «одной команды» (scripts/all.ps1): код разбирается, план печатается,
    # префлайт отвечает машинно. На свежем раннере venv и моделей нет — это ожидаемый
    # код 3 (есть FAIL в doctor), а не падение: скрипт честно говорит «среда не готова».
    name: all.ps1 — dry-run и префлайт (Windows)
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Синтаксис all.ps1 (PowerShell 5.1)
        shell: powershell
        run: |
          $err = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$env:GITHUB_WORKSPACE\scripts\all.ps1", [ref]$null, [ref]$err)
          if ($err.Count) { $err | ForEach-Object { $_.ToString() }; exit 1 }
          "разбирается без ошибок"

      - name: Инвентаризация среды и тесты модулей (инвентаризация, прогресс)
        shell: powershell
        run: |
          # -Inventory: 19 позиций, статусы, поле fix; на свежем раннере venv/моделей нет →
          # ожидаемый код 2 (нужен человек), 4 = сломанный скрипт
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/inventory.ps1 -Json
          if ($LASTEXITCODE -ge 4) { "::error::inventory.ps1 дал код $LASTEXITCODE"; exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/test-inventory.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/test-progress.ps1 -Fast
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: all.ps1 -DryRun (план без шага mcp)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/all.ps1 -DryRun -Steps venv,deps,models,doctor

      - name: "all.ps1 шаг mcp: образец конфига как фикстура"
        shell: bash
        run: |
          out="${RUNNER_TEMP:-.}/mcp-check.json"
          code=0
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/all.ps1 -CheckOnly -Steps mcp -McpConfig MCP-stanza-german/mcp.json.example -Json > "$out" || code=$?
          echo "код выхода: $code"
          [ "$code" -le 1 ] || { echo "::error::шаг mcp на валидном образце дал код $code"; exit 1; }
          grep -q 'mcp_snippet' "$out" || { echo "::error::в -Json нет mcp_snippet"; exit 1; }
          grep -q 'stanza-german' "$out" && echo "mcp: запись в образце найдена, фрагмент печатается"

      - name: all.ps1 -CheckOnly -Json (префлайт на чистой машине)
        shell: bash
        run: |
          code=0
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/all.ps1 -CheckOnly -Json || code=$?
          echo "код выхода all.ps1: $code"
          if [ "$code" -ge 4 ]; then echo "::error::all.ps1 сломан: код 4 (СЛОМАН ЗАПУСК)"; exit 1; fi
          # 2 = нет клиента MCP / gh / места — на свежем раннере это норма,
          # 3 = doctor FAIL (venv на раннере не ставится) — тоже норма
          echo "ok: all.ps1 отработал и ответил машинно (код $code)"
