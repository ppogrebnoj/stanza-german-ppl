name: installer-contract

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell 5.1 contract tests
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\tests\test-contract.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Capabilities registry parity
        shell: powershell
        run: |
          $a = powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -Check capabilities -Json | ConvertFrom-Json
          $b = powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\all.ps1 -Check capabilities -Json | ConvertFrom-Json
          $reg = Get-Content .\docs\flags.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if (($a.capabilities.flags.name -join ',') -ne ($reg.flags.name -join ',')) { throw 'capabilities != docs/flags.json' }
          if (($a | ConvertTo-Json -Depth 8) -ne ($b | ConvertTo-Json -Depth 8)) { throw 'install.ps1 output != all.ps1 output' }

      - name: No writes in check modes
        shell: powershell
        run: |
          # Диагностика в stdout, а не через throw: иначе в логе видно только
          # "Process completed with exit code 1" без причины.
          # Код 0 = всё есть, 2 = не установлено (норма для чистой машины), любой другой = сбой.
          $before = (Get-ChildItem -Recurse -File | ForEach-Object { $_.FullName + '|' + $_.Length }) -join "`n"
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -Check inventory -Json 2>&1
          $rc = $LASTEXITCODE
          "inventory rc=$rc"
          if ($rc -ne 0 -and $rc -ne 2) {
            "::error::check inventory rc=$rc (ожидались 0 или 2)"
            ($out | Select-Object -Last 25) -join "`n"
            exit 1
          }
          $after = (Get-ChildItem -Recurse -File | ForEach-Object { $_.FullName + '|' + $_.Length }) -join "`n"
          if ($before -ne $after) {
            "::error::read-only check modified files"
            Compare-Object ($before -split "`n") ($after -split "`n") | ForEach-Object { "$($_.SideIndicator) $($_.InputObject)" }
            exit 1
          }
          "read-only check: ok"
          # Явный выход: иначе шаг наследует $LASTEXITCODE от install.ps1 (там 2 =
          # «чистая машина») и падает, хотя все проверки прошли.
          exit 0

      - name: Python syntax
        shell: pwsh
        run: |
          python -m compileall -q scripts rule bench MCP-stanza-german
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
