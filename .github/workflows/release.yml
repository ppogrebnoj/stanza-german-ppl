name: release-installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version from CHANGELOG.md
        id: version
        shell: powershell
        run: |
          $text = Get-Content .\MCP-stanza-german\CHANGELOG.md -Raw -Encoding UTF8
          $m = [regex]::Match($text, '(?m)^##\s+(\d+\.\d+\.\d+)(?:\s|$)')
          if (-not $m.Success) { throw 'нет версии в CHANGELOG.md' }
          $tag = "v$($m.Groups[1].Value)"
          $ref = "${{ github.ref_name }}"
          if ($ref -like 'v*' -and $ref -ne $tag) { throw "тег $ref не совпадает с версией CHANGELOG.md ($tag)" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append

      - name: Build release assets
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\release.ps1 -Tag "${{ steps.version.outputs.tag }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish release assets
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $dir = Join-Path (Get-Location) '.tmp\release'
          $assets = @(
            (Join-Path $dir 'bootstrap.ps1'),
            (Join-Path $dir 'bootstrap.ps1.sha256'),
            (Join-Path $dir 'stanza-german-ppl-source.zip'),
            (Join-Path $dir 'stanza-german-ppl-source.zip.sha256')
          )
          gh release create $tag --title "Installer $tag" --notes-file (Join-Path $dir 'RELEASE_BODY.md') $assets
          if ($LASTEXITCODE -ne 0) { gh release upload $tag $assets --clobber }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
