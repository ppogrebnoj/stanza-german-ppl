name: release-installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release assets and update README SHA256
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag -or $tag -eq 'refs/heads/master') { $tag = 'v0.0.0-dev' }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\release.ps1 -Tag $tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit updated README and bootstrap checksum
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add README.md bootstrap.ps1.sha256
          git commit -m "release: update bootstrap SHA256 [skip ci]" 2>$null
          git push origin HEAD:${{ github.ref_name }} 2>$null

      - name: Publish release assets
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $dir = Join-Path (Get-Location) '.tmp\release'
          $assets = @(
            (Join-Path $dir 'bootstrap.ps1'),
            (Join-Path $dir 'bootstrap.ps1.sha256'),
            (Join-Path $dir 'stanza-german-ppl-source.zip'),
            (Join-Path $dir 'stanza-german-ppl-source.zip.sha256')
          )
          gh release create $tag --title "Installer $tag" --notes-file (Join-Path $dir 'RELEASE_BODY.md') $assets
          if ($LASTEXITCODE -ne 0) { gh release upload $tag $assets --clobber }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
